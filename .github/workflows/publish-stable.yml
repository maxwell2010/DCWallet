name: Publish verified stable
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Native checks run ID from main
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-alpha-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - name: Verify source run and all native jobs
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg repo "$GH_REPO" '.status == "completed" and .conclusion == "success" and .head_repository.full_name == $repo and .head_branch == "main" and .path == ".github/workflows/check.yml"' run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          jq -e '([.jobs[] | select(.conclusion == "success") | .name] | sort) == (["win-x64","win-arm64","linux-x64","linux-arm64","osx-x64","osx-arm64","Verify all platform downloads"] | sort)' jobs.json
          echo "sha=$(jq -r .head_sha run.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-platform-downloads
          path: dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Validate complete packages and checksums
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/DCWallet/DCWallet.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable release requires a stable semantic version' }
          $manifest = Get-Content dist/DOWNLOADS.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version -or $manifest.assets.Count -ne 13) { throw 'Unexpected release manifest' }
          & bash -c 'cd dist && sha256sum -c SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'CI artifact hash mismatch' }
          ./tools/prepare-release-assets.ps1 -Version $version -Directory dist -RequirePackages
          if ($LASTEXITCODE -ne 0) { throw 'Release asset preparation failed' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish stable and preserve alpha updater compatibility
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          for tag in "build/$VERSION" "v$VERSION"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > tag.json 2>/dev/null; then
              test "$(jq -r .object.sha tag.json)" = "$SOURCE_SHA"
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA" > /dev/null
            fi
          done
          cp docs/RELEASE_NOTES.md release-notes.md
          printf '\nNative CI: https://github.com/%s/actions/runs/%s\nSource commit: %s\nSource tag: v%s\n' "$GH_REPO" "$SOURCE_RUN" "$SOURCE_SHA" "$VERSION" >> release-notes.md
          mapfile -t assets < <(jq -r '.assets[] | .file, .versionedFile' dist/DOWNLOADS.json)
          files=(dist/DOWNLOADS.json dist/SHA256SUMS.txt)
          for asset in "${assets[@]}"; do files+=("dist/$asset"); done
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft > stable.json 2>/dev/null; then
            draft=$(jq -r .isDraft stable.json)
          else
            gh release create "$tag" --verify-tag --draft --title "DC WALLET $VERSION" --notes-file release-notes.md
            draft=true
          fi
          if [ "$draft" = true ]; then
            mapfile -t old_assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            for asset in "${old_assets[@]}"; do gh release delete-asset "$tag" "$asset" --yes; done
            gh release upload "$tag" "${files[@]}"
            gh release edit "$tag" --draft=false --prerelease=false --latest --title "DC WALLET $VERSION" --notes-file release-notes.md
          else
            # A rerun may finish the alpha mirror; published stable assets stay immutable.
            mkdir -p published
            gh release download "$tag" --pattern DOWNLOADS.json --pattern SHA256SUMS.txt --dir published
            cmp dist/DOWNLOADS.json published/DOWNLOADS.json
            cmp dist/SHA256SUMS.txt published/SHA256SUMS.txt
          fi
          cp release-notes.md alpha-notes.md
          printf '\nCompatibility mirror for older alpha clients. Stable release: https://github.com/%s/releases/tag/v%s\n' "$GH_REPO" "$VERSION" >> alpha-notes.md
          if gh release view alpha > /dev/null 2>&1; then
            gh release edit alpha --draft=true
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/alpha" -f "sha=$SOURCE_SHA" -F force=true > /dev/null
            mapfile -t old_assets < <(gh release view alpha --json assets --jq '.assets[].name')
            for asset in "${old_assets[@]}"; do gh release delete-asset alpha "$asset" --yes; done
          else
            gh release create alpha --target "$SOURCE_SHA" --draft --prerelease --title "DC WALLET $VERSION" --notes-file alpha-notes.md
          fi
          gh release upload alpha "${files[@]}"
          gh release edit alpha --draft=false --prerelease --latest=false --title "DC WALLET $VERSION" --notes-file alpha-notes.md
          gh release view "$tag" --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assetCount:(.assets|length)}'
          gh release view alpha --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assetCount:(.assets|length)}'
